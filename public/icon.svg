<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1c2145" />
      <stop offset="100%" stop-color="#0f1225" />
    </radialGradient>
    <linearGradient id="mic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e8bff" />
      <stop offset="100%" stop-color="#6c7bff" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)" />
  <!-- microphone body -->
  <rect x="216" y="120" width="80" height="170" rx="40" fill="url(#mic)" />
  <!-- pickup arc -->
  <path d="M168 250 a88 88 0 0 0 176 0" fill="none" stroke="#4ad9c4"
        stroke-width="18" stroke-linecap="round" />
  <!-- stand -->
  <rect x="248" y="330" width="16" height="54" rx="8" fill="#4ad9c4" />
  <!-- base -->
  <rect x="210" y="380" width="92" height="16" rx="8" fill="#4ad9c4" />
</svg>
